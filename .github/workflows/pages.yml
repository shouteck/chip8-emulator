name: Deploy wasm demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest
          echo "/opt/emsdk" >> "$GITHUB_PATH"
          echo "/opt/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build WebAssembly demo
        run: |
          mkdir -p dist
          em++ -std=c++17 -O2 \
            -Iinclude src/main.cpp src/chip8.cpp \
            -sUSE_SDL=2 \
            --preload-file roms \
            --shell-file web/shell.html \
            -o dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
