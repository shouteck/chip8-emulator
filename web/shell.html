<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHIP-8 Emulator</title>
  <style>
    body {
      background: #14141e;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 16px; }
    canvas {
      border: 1px solid #444;
      image-rendering: pixelated;
      background: #000;
    }
    .keys {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, 44px);
      gap: 6px;
    }
    .key {
      border: 1px solid #555;
      border-radius: 5px;
      padding: 8px 0;
      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: 14px;
      color: #ccc;
      background: #1e1e2c;
    }
    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: #999;
      text-align: center;
      line-height: 1.6;
    }
    .hint b { color: #ccc; }
  </style>
</head>
<body>
  <h1>CHIP-8 Emulator</h1>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div class="hint">Click the screen first, then use these keys:</div>
  <div class="keys">
    <div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key">4</div>
    <div class="key">Q</div><div class="key">W</div><div class="key">E</div><div class="key">R</div>
    <div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div>
    <div class="key">Z</div><div class="key">X</div><div class="key">C</div><div class="key">V</div>
  </div>
  <div class="hint"><b>Pong:</b> 1 / Q = left paddle &nbsp;·&nbsp; 4 / R = right paddle</div>
  <script>
    var Module = { canvas: document.getElementById('canvas') };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
