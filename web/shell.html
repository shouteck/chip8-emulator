<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHIP-8 Emulator</title>
  <style>
    body {
      background: #14141e;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 16px; }
    canvas {
      border: 1px solid #444;
      image-rendering: pixelated;
      background: #000;
    }
    .keys {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 44px auto;
      gap: 8px;
      align-items: center;
    }
    .key {
      border: 1px solid #555;
      border-radius: 5px;
      padding: 8px 0;
      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: 14px;
      color: #ccc;
      background: #1e1e2c;
    }
    .lbl {
      font-size: 14px;
      color: #999;
    }
    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: #999;
      text-align: center;
      line-height: 1.6;
    }
    .hint b { color: #ccc; }
  </style>
</head>
<body>
  <h1>CHIP-8 Emulator</h1>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div class="hint">Click the screen, then move your paddle:</div>
  <div class="keys">
    <div class="key">1</div><span class="lbl">up</span>
    <div class="key">Q</div><span class="lbl">down</span>
  </div>
  <div class="hint">The right paddle is computer-controlled.</div>
  <script>
    var Module = { canvas: document.getElementById('canvas') };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
